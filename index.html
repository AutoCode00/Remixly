<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Base path (GitHub Pages project sites live under /<repo>/) + restore a deep link sent here by 404.html as ?r=.
  (function () {
    var l = location, seg = l.hostname.endsWith('github.io') ? l.pathname.split('/')[1] : '';
    window.__BASE = seg ? '/' + seg + '/' : '/';
    var p = new URLSearchParams(l.search), r = p.get('r');
    if (r != null) { p.delete('r'); var q = p.toString(); history.replaceState(null, '', window.__BASE + r.replace(/^\//, '') + (q ? '?' + q : '') + l.hash); }
    document.write('<base href="' + window.__BASE + '">');
  })();
</script>
<title>Remixly — one post in, a week of posts out</title>
<meta name="description" content="Paste a blog, link or transcript. Remixly writes your X thread, LinkedIn post, Telegram announcement, carousel, video script and email, plans the week, and records the pack on BOT Chain.">
<meta name="theme-color" content="#232323">
<meta property="og:title" content="Remixly — The posts you don't rewrite.">
<meta property="og:description" content="One piece of content in, a week of posts out. Recorded on BOT Chain.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
